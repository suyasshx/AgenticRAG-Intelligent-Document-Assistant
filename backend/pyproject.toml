[tool.poetry]
name = "fastapi-ai-agent"
version = "0.1.0"
description = "Agentic AI RAG application built with FastAPI, LangChain, Groq, and PostgreSQL"
authors = ["suyasshx <suyasshx09@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.29"
loguru = "^0.7.2"
pydantic-settings = "^2.2.1"
asyncpg = "^0.29.0"
sqlmodel = "^0.0.16"
pyyaml = "^6.0.1"
langchain = "^1.3.0"
langchain-openai = "^1.0.0"
langchain-groq = "^1.1.3"
pymupdf = "^1.24.0"
pgvector = "^0.2.5"
case-converter = "^1.1.0"
python-box = "^7.1.1"
redis = "^5.0.3"
langchainhub = "^0.1.15"
python-jose = "^3.3.0"
passlib = "^1.7.4"
fastapi-nextauth-jwt = "^1.1.2"
jinja2 = "^3.1.3"
python-multipart = "^0.0.9"
unstructured = {extras = ["all"], version = "^0.13.2"}
pdf2image = "^1.17.0"
pdfminer-six = "^20231228"
pillow-heif = "^0.16.0"
opencv-python = "^4.9.0.80"
pytesseract = "^0.3.10"
pandas = "^2.2.2"
pikepdf = "^8.15.0"
pypdf = "^4.2.0"
unstructured-pytesseract = "^0.3.12"
unstructured-inference = "^0.7.25"
langchain-classic = "^1.0.8"
langchain-huggingface = "^1.2.2"
sentence-transformers = "^5.7.0"
bcrypt = "4.0.1"


[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
